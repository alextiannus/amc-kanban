databases:
  - name: amc-db
    plan: free
    databaseName: amc
    user: amc_user

services:
  - type: web
    name: amc-kanban
    env: node
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        value: default-openclaw-key-2026
