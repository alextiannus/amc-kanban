services:
  - type: web
    name: amc-kanban
    env: node
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        value: postgresql://USER:PASSWORD@HOST/DATABASE  # Replace with actual Render Postgres URL in dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        value: default-openclaw-key-2026
