databases:
  - name: amc-db
    plan: basic-1gb
    databaseName: amc
    user: amc_user

services:
  # ── Main App: API + Kanban Frontend + AI Agents ───────────────────────────
  - type: web
    name: amc-kanban
    env: node
    buildCommand: npm install --ignore-scripts && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AMC_GROWTH_SSO_SECRET
        sync: false
      - key: AMC_GROWTH_URL
        value: https://amc-growth.immedi.ai
      - key: API_KEY
        value: default-openclaw-key-2026
      - key: AI_SINGLE_AGENT_MODE
        value: 'false'
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_INITIAL_PASSWORD
        sync: false
      - key: HUAWEI_OBS_ACCESS_KEY_ID
        sync: false
      - key: HUAWEI_OBS_SECRET_ACCESS_KEY
        sync: false
      - key: HUAWEI_OBS_BUCKET
        sync: false
      - key: HUAWEI_OBS_ENDPOINT
        sync: false
      - key: HUAWEI_OBS_REGION
        sync: false
      - key: HUAWEI_OBS_PUBLIC_BASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
