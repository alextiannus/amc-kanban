<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg2)"/>
  <!-- Chunky kawaii petals - outer ring (14 petals) -->
  <g transform="translate(50,50)">
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(0)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(25.7)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(51.4)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(77.1)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(102.8)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(128.5)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(154.2)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(180)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(205.7)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(231.4)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(257.1)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(282.8)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(308.5)"/>
    <ellipse rx="7" ry="18" cx="0" cy="-36" fill="#FFDD00" transform="rotate(334.2)"/>
    <!-- Inner ring petals (offset) -->
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(12.85)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(38.55)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(64.25)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(89.95)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(115.65)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(141.35)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(167.05)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(192.75)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(218.45)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(244.15)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(269.85)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(295.55)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(321.25)"/>
    <ellipse rx="5" ry="13" cx="0" cy="-30" fill="#FFE840" transform="rotate(346.95)"/>
