  <!-- White face -->
  <circle cx="50" cy="50" r="26" fill="white"/>
  <!-- Left eye: A -->
  <text x="40" y="48" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="900" fill="#3D1C00" text-anchor="middle" dominant-baseline="middle">A</text>
  <!-- Right eye: rotated i = horizontal bar + dot on right -->
  <rect x="52" y="43.5" width="11" height="3.5" rx="1.75" fill="#3D1C00"/>
  <circle cx="65" cy="40" r="2.5" fill="#3D1C00"/>
  <!-- Smile -->
  <path d="M 38 56 Q 50 65 62 56" stroke="#3D1C00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Blush cheeks (flat ovals) -->
  <ellipse cx="36" cy="56" rx="7" ry="3.5" fill="#FFB3C6" opacity="0.7"/>
  <ellipse cx="64" cy="56" rx="7" ry="3.5" fill="#FFB3C6" opacity="0.7"/>
</svg>
