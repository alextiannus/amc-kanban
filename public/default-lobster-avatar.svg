<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shellGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B5B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E85450;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D63F48;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGradient)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFD4B8" stroke-width="2" opacity="0.3"/>
  
  <!-- Soft shadow -->
  <ellipse cx="100" cy="165" rx="45" ry="12" fill="#00000010"/>
  
  <!-- Left Antenna -->
  <line x1="85" y1="45" x2="70" y2="20" stroke="#FF6B5B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="20" r="5" fill="#FF6B5B"/>
  <circle cx="70" cy="20" r="3" fill="#FFB8AA"/>
  
  <!-- Right Antenna -->
  <line x1="115" y1="45" x2="130" y2="20" stroke="#FF6B5B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="130" cy="20" r="5" fill="#FF6B5B"/>
  <circle cx="130" cy="20" r="3" fill="#FFB8AA"/>
  
  <!-- Main Head/Body (Rounded trapezoid) -->
  <ellipse cx="100" cy="95" rx="48" ry="52" fill="url(#shellGradient)"/>
  
  <!-- Shell Details -->
  <path d="M 80 70 Q 100 65 120 70" stroke="#E85450" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 75 90 Q 100 87 125 90" stroke="#E85450" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 70 110 Q 100 108 130 110" stroke="#D63F48" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Highlight on shell -->
  <ellipse cx="85" cy="75" rx="12" ry="15" fill="#FFFFFF" opacity="0.15"/>
  
  <!-- Left Eye White -->
  <circle cx="80" cy="85" r="12" fill="#FFFFFF" stroke="#FFB8AA" stroke-width="2"/>
  
  <!-- Right Eye White -->
  <circle cx="120" cy="85" r="12" fill="#FFFFFF" stroke="#FFB8AA" stroke-width="2"/>
  
  <!-- Left Iris -->
  <circle cx="80" cy="85" r="7" fill="#2C3E50"/>
  <circle cx="80" cy="85" r="7" fill="url(#eyeGlow)" opacity="0.4"/>
  
  <!-- Right Iris -->
  <circle cx="120" cy="85" r="7" fill="#2C3E50"/>
  <circle cx="120" cy="85" r="7" fill="url(#eyeGlow)" opacity="0.4"/>
  
  <!-- Left Pupil Shine -->
  <circle cx="77" cy="82" r="3" fill="#FFFFFF"/>
  
  <!-- Right Pupil Shine -->
  <circle cx="117" cy="82" r="3" fill="#FFFFFF"/>
  
  <!-- Mouth (happy smile) -->
  <path d="M 90 110 Q 100 118 110 110" stroke="#FF8C8C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left Cheek Blush -->
  <ellipse cx="65" cy="100" rx="8" ry="6" fill="#FFB8AA" opacity="0.6"/>
  
  <!-- Right Cheek Blush -->
  <ellipse cx="135" cy="100" rx="8" ry="6" fill="#FFB8AA" opacity="0.6"/>
  
  <!-- Left Front Leg -->
  <line x1="72" y1="135" x2="60" y2="160" stroke="#FF6B5B" stroke-width="7" stroke-linecap="round"/>
  <circle cx="60" cy="160" r="4" fill="#FF6B5B"/>
  
  <!-- Right Front Leg -->
  <line x1="128" y1="135" x2="140" y2="160" stroke="#FF6B5B" stroke-width="7" stroke-linecap="round"/>
  <circle cx="140" cy="160" r="4" fill="#FF6B5B"/>
  
  <!-- Left Back Leg -->
  <line x1="78" y1="142" x2="68" y2="168" stroke="#E85450" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="68" cy="168" r="3.5" fill="#E85450" opacity="0.8"/>
  
  <!-- Right Back Leg -->
  <line x1="122" y1="142" x2="132" y2="168" stroke="#E85450" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="132" cy="168" r="3.5" fill="#E85450" opacity="0.8"/>
  
  <!-- Left Claw -->
  <ellipse cx="52" cy="155" rx="6" ry="4" fill="#FF6B5B" transform="rotate(-20 52 155)"/>
  <path d="M 48 158 L 42 165" stroke="#FF6B5B" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Right Claw -->
  <ellipse cx="148" cy="155" rx="6" ry="4" fill="#FF6B5B" transform="rotate(20 148 155)"/>
  <path d="M 152 158 L 158 165" stroke="#FF6B5B" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Sparkle effect (top left) -->
  <g opacity="0.7">
    <circle cx="55" cy="50" r="2" fill="#FFD700"/>
    <path d="M 55 45 L 55 55 M 50 50 L 60 50" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Sparkle effect (top right) -->
  <g opacity="0.6">
    <circle cx="145" cy="45" r="1.5" fill="#FFD700"/>
    <path d="M 145 41 L 145 49 M 141 45 L 149 45" stroke="#FFD700" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>