<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <!-- Main gradient: deep blue → electric cyan -->
    <linearGradient id="grad-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <!-- Icon bg gradient -->
    <linearGradient id="grad-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ── Icon mark: hexagon + neural nodes ── -->
  <g filter="url(#shadow)">
    <!-- Hexagon background -->
    <polygon
      points="60,10 95,30 95,70 60,90 25,70 25,30"
      fill="url(#grad-icon)"
      opacity="0.95"
    />
    <!-- Hexagon border glow -->
    <polygon
      points="60,10 95,30 95,70 60,90 25,70 25,30"
      fill="none"
      stroke="url(#grad-main)"
      stroke-width="1.5"
      opacity="0.6"
    />

    <!-- Neural network lines -->
    <g stroke="#e0f2fe" stroke-width="1" opacity="0.35">
      <line x1="42" y1="38" x2="60" y2="50"/>
      <line x1="78" y1="38" x2="60" y2="50"/>
      <line x1="42" y1="62" x2="60" y2="50"/>
      <line x1="78" y1="62" x2="60" y2="50"/>
      <line x1="42" y1="38" x2="42" y2="62"/>
      <line x1="78" y1="38" x2="78" y2="62"/>
    </g>

    <!-- Nodes -->
    <circle cx="60" cy="50" r="6" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="42" cy="38" r="3.5" fill="#818cf8"/>
    <circle cx="78" cy="38" r="3.5" fill="#818cf8"/>
    <circle cx="42" cy="62" r="3.5" fill="#34d399"/>
    <circle cx="78" cy="62" r="3.5" fill="#34d399"/>

    <!-- Center dot pulse ring -->
    <circle cx="60" cy="50" r="9" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- "AMC" large -->
  <text
    x="116" y="68"
    font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="-1.5"
    fill="url(#grad-main)"
  >AMC</text>

  <!-- Divider line -->
  <line x1="116" y1="78" x2="358" y2="78" stroke="url(#grad-main)" stroke-width="1.5" opacity="0.3"/>

  <!-- Tagline -->
  <text
    x="116" y="95"
    font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif"
    font-size="12.5"
    font-weight="500"
    letter-spacing="4"
    fill="#94a3b8"
  >AI MARKETING CONTENT</text>

  <!-- Subtle accent dots on tagline ends -->
  <circle cx="110" cy="91" r="2" fill="#06b6d4" opacity="0.7"/>
  <circle cx="364" cy="91" r="2" fill="#10b981" opacity="0.7"/>
</svg>
