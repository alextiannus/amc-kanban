user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # amc-kanban.localhost → main app (port 3000)
  server {
    listen 80;
    server_name amc-kanban.localhost localhost;

    location / {
      proxy_pass http://amc-kanban:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 120s;
    }
  }

  # amc-mm.localhost → brand-owner app (port 3001)
  server {
    listen 80;
    server_name amc-mm.localhost;

    location / {
      proxy_pass http://amc-mm:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 120s;
    }
  }
}
